name: update-profile
on:
  schedule:
  - cron: "30 18 * * *"      # every day, 02:17 UTC (refreshes hi-score + your pfp)
  workflow_dispatch: {}       # run by hand from the Actions tab
  push:
    paths: ["github-readme/config.py"]      # edit config.py on github.com -> auto rebuild
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r github-readme/requirements.txt
      - run: python3 github-readme/build.py
      - name: commit if changed
        run: |
          git config user.name "hi-score-bot"
          git config user.email "hi-score-bot@users.noreply.github.com"
          git add github-readme README.md
          git diff --cached --quiet || (git commit -m "chore: rebuild profile" && git push)
